<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Cihat Karaboğa — social preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500&display=swap"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 52px 64px 48px;
        background: #0c0c0d;
        color: #ededeb;
        font-family: "Inter Tight", -apple-system, sans-serif;
        letter-spacing: -0.011em;
        -webkit-font-smoothing: antialiased;
      }
      .top,
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 20px;
        color: #a1a1a7;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ededeb;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      h1 {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-left: -8px;
        font-size: 176px;
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.055em;
      }
      .dot {
        color: #3659db;
      }
      .bottom {
        padding-top: 26px;
        border-top: 1px solid #242427;
      }
      .tagline {
        color: #ededeb;
        font-size: 30px;
        letter-spacing: -0.035em;
      }
      .tagline em {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 1.06em;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand"><img src="./favicon.svg" alt="" />karaboga.dev</div>
      <span>Mobile Software Engineer · Istanbul</span>
    </div>
    <h1>
      <span>Cihat</span><span>Karaboğa<span class="dot">.</span></span>
    </h1>
    <div class="bottom">
      <p class="tagline">Thoughtful apps, <em>solid engineering.</em></p>
      <span>Flutter · iOS · Android</span>
    </div>
  </body>
</html>
