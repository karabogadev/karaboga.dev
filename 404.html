<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page not found · Cihat Karaboğa</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" id="theme-color" content="#0c0c0d" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500&display=swap"
    />

    <!-- same pre-paint theme + language resolution as the home page -->
    <script>
      (function () {
        var d = document.documentElement;
        var read = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (_) {
            return null;
          }
        };
        var stored = read("theme");
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        d.setAttribute("data-theme", theme);
        var meta = document.getElementById("theme-color");
        if (meta) meta.content = theme === "dark" ? "#0c0c0d" : "#f6f6f3";

        var param = new URLSearchParams(location.search).get("lang");
        var lang =
          param === "tr" || param === "en"
            ? param
            : ((read("lang") === "tr" || read("lang") === "en") &&
                read("lang")) ||
              ((navigator.language || "en").toLowerCase().indexOf("tr") === 0
                ? "tr"
                : "en");
        d.setAttribute("data-lang", lang);
      })();
    </script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }
      :root {
        --sans:
          "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
        --pad: clamp(1.25rem, 4vw, 3rem);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      [data-theme="light"] {
        --bg: #f6f6f3;
        --ink: #111113;
        --ink-2: #55555b;
        --ink-3: #6b6b72;
        --line: #e0e0db;
        --accent: #3659db;
        --accent-ink: #3659db;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --bg: #0c0c0d;
        --ink: #ededeb;
        --ink-2: #a1a1a7;
        --ink-3: #8a8a91;
        --line: #242427;
        --accent: #3659db;
        --accent-ink: #8fa2ff;
        color-scheme: dark;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 400 1rem/1.6 var(--sans);
        letter-spacing: -0.011em;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: 100%;
        max-width: 80rem;
        padding-inline: var(--pad);
        margin-inline: auto;
      }
      header .wrap {
        display: flex;
        align-items: center;
        min-height: 4.25rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 44px;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: inherit;
        text-decoration: none;
      }
      .brand img {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        padding-block: 3rem 5rem;
      }
      .code {
        font-size: clamp(6rem, 26vw, 16rem);
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.06em;
        margin-left: -0.06em;
        overflow: hidden;
      }
      .code span {
        display: inline-block;
        animation: rise 1.2s var(--ease) both;
      }
      .dot {
        color: var(--accent);
      }
      h1 {
        margin-top: clamp(1.5rem, 4vw, 2.5rem);
        font-size: clamp(1.6rem, 3.4vw, 2.6rem);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .it {
        font-family: var(--serif);
        font-style: italic;
        font-size: 1.06em;
        letter-spacing: -0.01em;
      }
      p {
        max-width: 40ch;
        margin-top: 0.75rem;
        color: var(--ink-2);
      }
      .home {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        min-height: 48px;
        margin-top: 2rem;
        padding: 0.75rem 1.35rem;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition:
          background 0.35s var(--ease),
          color 0.35s var(--ease);
      }
      .home:hover {
        background: var(--accent);
        color: #fff;
      }
      .home svg {
        width: 16px;
        height: 16px;
        transition: transform 0.35s var(--ease);
      }
      .home:hover svg {
        transform: translateX(-3px);
      }
      :focus-visible {
        outline: 2px solid var(--accent-ink);
        outline-offset: 4px;
        border-radius: 4px;
      }
      .copy {
        animation: settle 1s 0.3s var(--ease) both;
      }
      @keyframes rise {
        from {
          transform: translateY(105%);
        }
        to {
          transform: none;
        }
      }
      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="/"
          ><img src="/favicon.svg" alt="" width="22" height="22" />karaboga.dev</a
        >
      </div>
    </header>
    <main>
      <div class="wrap">
        <div class="code" aria-hidden="true">
          <span>404<span class="dot">.</span></span>
        </div>
        <div class="copy">
          <h1>
            <span data-i18n="title.a">This page</span>
            <em class="it" data-i18n="title.b">wandered off.</em>
          </h1>
          <p data-i18n="body">
            The link is broken, or the page no longer exists.
          </p>
          <a class="home" href="/">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5m6 6-6-6 6-6" />
            </svg>
            <span data-i18n="home">Back to karaboga.dev</span>
          </a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var html = document.documentElement;
        var TR = {
          "title.a": "Bu sayfa",
          "title.b": "kaybolmuş.",
          body: "Bağlantı bozuk ya da sayfa artık mevcut değil.",
          home: "karaboga.dev’e dön",
        };
        if (html.getAttribute("data-lang") !== "tr") return;
        html.setAttribute("lang", "tr");
        document.querySelector(".home").href = "/?lang=tr";
        document.querySelector(".brand").href = "/?lang=tr";
        document.title = "404 — Sayfa bulunamadı · Cihat Karaboğa";
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var v = TR[el.getAttribute("data-i18n")];
          if (v != null) el.textContent = v;
        });
      })();
    </script>
  </body>
</html>
